name: CI/CD - API de Atletas

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # CI - Integração Contínua
  # =========================
  test:
    name: CI - Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

  # =========================
  # CD - Entrega Contínua
  # =========================
  delivery:
    name: CD - Gerar artefato
    runs-on: ubuntu-latest
    needs: test

    # CD somente depois que o código chegar na main
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências de produção
        run: npm ci --omit=dev

      - name: Preparar aplicação para entrega
        run: |
          mkdir -p dist
          cp -r src dist/
          cp package.json dist/
          cp package-lock.json dist/

      - name: Gerar pacote da aplicação
        run: tar -czf api-atletas.tar.gz dist

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: api-atletas
          path: api-atletas.tar.gz

  # =========================
  # NOTIFICAÇÃO - DISCORD
  # =========================
  notify:
    name: Notificar Discord
    runs-on: ubuntu-latest
    needs: [test, delivery]

    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Enviar alerta ao Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_RESULT: ${{ needs.test.result }}
          DELIVERY_RESULT: ${{ needs.delivery.result }}

        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Secret DISCORD_WEBHOOK_URL não configurado."
            exit 1
          fi

          MESSAGE=$(printf '📢 Atualização na main\nRepositório: %s\nCommit: %s\nAutor: %s\nTestes: %s\nEntrega: %s\nExecução: %s' \
            "$GITHUB_REPOSITORY" \
            "${GITHUB_SHA:0:7}" \
            "$GITHUB_ACTOR" \
            "$TEST_RESULT" \
            "$DELIVERY_RESULT" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")

          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"